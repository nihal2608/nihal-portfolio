spring.application.name=nihal-portfolio
server.port=8080

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ansh?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Upload Configuration
app.base-url=${APP_BASE_URL:http://localhost:8080}
file.upload-dir=${FILE_UPLOAD_DIR:E:/uploads}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JWT Configuration
#jwt.secret=${JWT_SECRET}
#jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.secret=VGhpc0lzTXlTdXBlclNlY3JldEtleUZvckpXVFRva2VuR2VuZXJhdGlvbjEyMzQ1Njc4OTA=
jwt.expiration=86400000

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=nihal.ansh123@gmail.com
spring.mail.password=Nihal@2608
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


